apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: 331760067638.dkr.ecr.ap-south-1.amazonaws.com/prod-nginx
        ports:
        - containerPort: 80
